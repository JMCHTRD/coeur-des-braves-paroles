<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chansons - Coeur des Braves - Suresnes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/coeur-des-braves-paroles/css/style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .song-item:hover { 
            transform: translateY(-2px) scale(1.01); 
            box-shadow: 0 6px 15px rgba(0,0,0,0.1); 
            background-color: #f0f9ff; /* light blue hover */
        }
        /* Plus besoin de .nav-sticky-padding, géré par JS */
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <!-- Le header sera injecté ici -->
    <div id="header-placeholder"></div>

    <main id="main-content" class="container mx-auto p-4 md:p-6">
        <header class="text-center mb-8">
            <h2 class="text-3xl sm:text-4xl font-bold mb-4 titre-page">Notre Répertoire</h2>
            <p class="text-lg text-gray-600">Cliquez sur un titre pour afficher les paroles.</p>
        </header>

        <!-- Section pour une recherche/filtrage -->
        <div class="mb-8 max-w-xl mx-auto">
            <input type="text" id="searchInput" placeholder="Rechercher une chanson..."
                   class="w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-shadow">
        </div>

        <ul id="songList" class="space-y-3 md:space-y-4">
            <!-- La liste des chansons sera injectée ici par JavaScript -->
        </ul>
         <p id="noResultsMessage" class="text-center text-gray-500 mt-8" style="display:none;">Aucune chanson ne correspond à votre recherche.</p>
    </main>

    <!-- Le footer sera injecté ici -->
    <div id="footer-placeholder"></div>

    <script src="/coeur-des-braves-paroles/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const songListElement = document.getElementById('songList');
            const searchInputElement = document.getElementById('searchInput');
            const noResultsMessage = document.getElementById('noResultsMessage');
            const pageTitleElement = document.querySelector('.titre-page');
            const pageSubtitleElement = pageTitleElement.nextElementSibling;
            
            const CONCERTS_STORAGE_KEY = 'coeurDesBravesConcerts';
            const ACTIVE_CONCERT_STORAGE_KEY = 'coeurDesBravesActiveConcert';
            let allSongs = {};
            let displayedSongIds = [];

            function fetchAllData() {
                const songsPromise = fetch('songs.json', { cache: 'no-cache' }).then(res => res.json());
                const concertsPromise = fetch('concerts.json', { cache: 'no-cache' }).then(res => res.json());

                return Promise.all([songsPromise, concertsPromise]).then(([songsData, concertData]) => {
                    allSongs = songsData;
                    const activeConcertName = concertData.active;
                    const concertLists = concertData.lists || {};

                    if (activeConcertName && concertLists[activeConcertName]) {
                        // Mode Concert
                        displayedSongIds = concertLists[activeConcertName];
                        pageTitleElement.textContent = `Concert: ${activeConcertName}`;
                        pageSubtitleElement.textContent = `Voici la liste des chansons pour ce concert.`;
                        searchInputElement.style.display = 'none'; // Cacher la recherche en mode concert
                    } else {
                        // Mode normal
                        displayedSongIds = Object.keys(allSongs).sort((a, b) => {
                            return allSongs[a].title.localeCompare(allSongs[b].title);
                        });
                    }
                    displaySongs(displayedSongIds);
                }).catch(err => {
                    // Si concerts.json n'existe pas ou est invalide, on affiche tout
                    console.warn("Could not load or parse concerts.json, showing all songs.", err);
                    return fetch('songs.json', { cache: 'no-cache' }).then(res => res.json()).then(songsData => {
                        allSongs = songsData;
                        displayedSongIds = Object.keys(allSongs).sort((a, b) => allSongs[a].title.localeCompare(allSongs[b].title));
                        displaySongs(displayedSongIds);
                    });
                });
            }

            fetchAllData().catch(error => {
                console.error('Erreur lors du chargement des chansons:', error);
                songListElement.innerHTML = '<li class="text-center text-red-500">Impossible de charger la liste des chansons.</li>';
            });

            function displaySongs(songIds) {
                songListElement.innerHTML = ''; // Vide la liste actuelle
                if (songIds.length === 0 && document.activeElement !== searchInputElement) {
                    noResultsMessage.style.display = 'block';
                } else {
                    noResultsMessage.style.display = 'none';
                }

                songIds.forEach(songId => {
                    const song = allSongs[songId];
                    if (!song) return; // Sécurité si un ID de chanson est invalide
                    
                    const listItem = document.createElement('li');
                    listItem.className = 'song-item bg-white p-4 rounded-lg shadow-md transition-all duration-200 ease-in-out';
                    
                    const link = document.createElement('a');
                    link.href = `paroles/index.html?song=${songId}`;
                    link.className = 'block text-lg font-medium lien-contenu';
                    link.textContent = song.title;
                    
                    listItem.appendChild(link);
                    songListElement.appendChild(listItem);
                });
            }

            searchInputElement.addEventListener('keyup', function() {
                const searchTerm = searchInputElement.value.toLowerCase().trim();
                
                const filteredSongIds = displayedSongIds.filter(songId => {
                    return allSongs[songId].title.toLowerCase().includes(searchTerm);
                });

                // En mode normal, on trie par alphabet. En mode concert, on garde l'ordre.
                const activeConcertName = localStorage.getItem('coeurDesBravesActiveConcert'); // Ce check est maintenant implicite via displayedSongIds
                if (displayedSongIds.length === Object.keys(allSongs).length) {
                    filteredSongIds.sort((a, b) => {
                        return allSongs[a].title.localeCompare(allSongs[b].title);
                    });
                }
                
                displaySongs(filteredSongIds);
            });
        });
    </script>
</body>
</html>
